{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>
        Notifications
    </h1>


    {% for notification in notifications %}

        <div class="card">

            <p>
                {{ notification.message }}
            </p>

            <small>
                {{ notification.created_at }}
            </small>

        </div>

    {% empty %}

        <p>
            No notifications.
        </p>

    {% endfor %}

</div>

{% endblock %}
