{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>
        General User Registration
    </h2>

    <form method="POST">

        {% csrf_token %}

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Phone
        </label>

        <input
            type="text"
            name="phone"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            required
        >


        <button
            type="submit"
            class="button"
        >
            Create Account
        </button>

    </form>

</div>

{% endblock %}
